name: CI/CD Deployment to Cloud Run

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json  # ← Added!
        
    - name: Install dependencies
      run: npm ci
      working-directory: ./backend  # ← Added!
      
    - name: Run Integration Tests
      run: npm test
      working-directory: ./backend  # ← Added!

  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Build and Push Container
      run: |
        IMAGE_NAME=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/daycare-repo/attendance-app:${{ github.sha }}
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy daycare-attendance-system \
          --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/daycare-repo/attendance-app:${{ github.sha }} \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --set-env-vars NODE_ENV=production \
          --add-volume=name=sqlite-volume,type=cloud-storage,bucket=daycare-db-bucket \
          --add-volume-mount=volume=sqlite-volume,mount-path=/mnt/storage \
          --execution-environment=gen2 \
          --max-instances=1 \
          --service-account=github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com