name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'  # ✅ Added!
      
      - name: Install dependencies
        run: cd backend && npm ci  # ✅ updated!
      
      - name: Run tests
        run: cd backend && npm test  # ✅ updated!
      
      - name: Run linter
        run: cd backend && npm run lint --if-present  # ✅ updated!
      
      - name: Build
        run: cd backend && npm run build --if-present  # ✅ updated!

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'  # ✅ added!
      
      - name: Install dependencies
        run: cd backend && npm ci  # ✅ updated!!
      
      - name: Build
        run: cd backend && npm run build --if-present  # ✅ updated!!
      
      - name: Deploy to production
        run: |
          echo "Deploying to production..."